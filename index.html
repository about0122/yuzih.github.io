    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            /* 背景改為暖橘色系漸層，呼應「荔枝」與圖片主色 */
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);

        .profile-image-container {
            border: 4px solid white;
            box-shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.2); /* 橘色陰影 */
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 按鈕懸浮效果 */
        .link-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.15);
        }
        
        /* 自定義強調色文字 */
        .highlight-text {
            color: #e98432;
        }
    </style>
</head>
<body class="text-slate-800 flex justify-center items-center py-10 px-4 min-h-screen">

                    <!-- 左側 QR Code 按鈕 -->
                    <button onclick="openModal()" class="absolute left-0 p-3 bg-orange-50 rounded-2xl text-orange-400 hover:bg-orange-100 hover:text-orange-600 transition-all duration-300 border border-orange-100 group" title="顯示 QR Code">
                        <i class="fa-solid fa-qrcode text-xl group-hover:scale-110 transition-transform"></i>
                    </button>

                    <!-- 頭像 -->
                    <div class="w-32 h-32 rounded-full overflow-hidden profile-image-container ring-8 ring-orange-50">

                             style="object-position: center top;">
                    </div>
                </div>
                
                <!-- 姓名 -->
                <h1 class="text-3xl font-extrabold text-slate-900 mb-6 tracking-tight">林昱孜 <span class="text-xl font-bold text-orange-500">(荔枝)</span></h1>
                
                <!-- 職稱內容 -->
                <div class="text-slate-600 text-[15px] mb-8 w-full space-y-2 font-medium">

                    <p>立法委員王安祥團隊副主任</p>

                    <!-- 重點強調標語 (依據要求加大字體與改色) -->
                    <p class="font-bold text-xl highlight-text" style="color: #e98432;">
                        提供免費法律及陳情服務
                    </p>
                </div>

                <!-- 社交媒體連結 -->
                <div class="grid grid-cols-6 gap-2 w-full max-w-[340px]">
                    <!-- 第一個連結 (您提供的是 Threads，暫放於此位置，若有 IG 可替換) -->
                    <a href="https://www.threads.com/@to7912102003" target="_blank" class="aspect-square bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-black link-card">
                         <i class="fa-solid fa-at text-lg"></i>

                    <!-- Facebook -->
                    <a href="https://www.facebook.com/linyuzih79" target="_blank" class="aspect-square bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-[#1877F2] link-card">
                        <i class="fab fa-facebook-f text-base"></i>
                    </a>

                    <!-- YouTube -->
                    <a href="https://www.youtube.com/@yuzih1210" target="_blank" class="aspect-square bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-[#FF0000] link-card">
                        <i class="fab fa-youtube text-lg"></i>
                    </a>

                    <!-- TikTok -->
                    <a href="https://www.tiktok.com/@yuzih791210" target="_blank" class="aspect-square bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-black link-card">
                        <i class="fab fa-tiktok text-base"></i>
                    </a>

                    <!-- Threads (重複連結，放置於此) -->
                    <a href="https://www.threads.com/@to7912102003" target="_blank" class="aspect-square bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-black link-card">

            <!-- 頁尾 -->

    </main>

    <!-- QR Code 彈出視窗 -->
    <div id="qrModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-md hidden opacity-0 transition-opacity duration-300" onclick="closeModal()">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl max-w-[90%] w-[340px] relative transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
            <!-- 關閉按鈕 -->
            <button onclick="closeModal()" class="absolute -top-14 right-0 text-white text-4xl hover:text-slate-300 transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="text-center">
                <div class="mb-6">
                    <h3 class="text-slate-900 font-bold text-xl mb-1">林昱孜 (荔枝)</h3>
                    <p class="text-slate-400 text-sm font-medium highlight-text">數位名片 QR Code</p>
                </div>
                
                <div class="bg-orange-50 p-4 rounded-3xl shadow-inner mb-6">
                    <!-- 使用 Google Chart API 生成當前網址的 QR Code 作為範例 -->
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://www.facebook.com/linyuzih79" alt="QR Code" class="w-full h-full rounded-xl mix-blend-multiply opacity-90">
                </div>
                
                <p class="text-slate-400 text-xs">掃描上方 QR Code 即可分享此頁面</p>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('qrModal');
        const modalContent = modal.querySelector('div');

        function openModal() {
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.add('opacity-100');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('opacity-100');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
        }
    </script>
</body>
</html>
